name: Windows RDP Free

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Nhap Ngrok Authtoken'
        required: true
        default: ''

env:
  NGROK_AUTH_TOKEN: ${{ github.event.inputs.ngrok_token }}
  RDP_USER: admin
  RDP_PASS: KhangSMP@VN2026!

jobs:
  ngrok-rdp:
    name: Khoi Dong Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: 1. Setup Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
        New-LocalUser -Name $env:RDP_USER -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force) *>$null
        Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USER
        Enable-LocalUser -Name $env:RDP_USER
        Write-Host 'Setup user thanh cong!' -ForegroundColor Green

    - name: 2. Install and Configure Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .\ngrok
        .\ngrok\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
        Write-Host 'Authtoken da duoc cau hinh!' -ForegroundColor Green

    - name: 3. Start Ngrok Tunnel
      run: |
        Start-Process -FilePath '.\ngrok\ngrok.exe' -ArgumentList 'tcp 3389' -WindowStyle Hidden
        $attempts = 0
        $maxAttempts = 12
        $ngrokUrl = $null
        while (-not $ngrokUrl -and $attempts -lt $maxAttempts) {
          Start-Sleep -Seconds 5
          $attempts++
          try {
            $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
            $ngrokUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'tcp' }).public_url
          } catch {
            Write-Host "Dang doi tunnel ($attempts/$maxAttempts)..."
          }
        }
        $cleanUrl = $ngrokUrl -replace '^tcp://', ''
        Write-Host ''
        Write-Host '==========================================================' -ForegroundColor Green
        Write-Host '🎉 MAY AO WINDOWS RDP DA SAN SANG KET NOI!' -ForegroundColor Cyan
        Write-Host "📱 DIA CHI PC NAME: $cleanUrl" -ForegroundColor Yellow
        Write-Host "👤 USERNAME: $env:RDP_USER" -ForegroundColor Yellow
        Write-Host "🔑 PASSWORD: $env:RDP_PASS" -ForegroundColor Yellow
        Write-Host '==========================================================' -ForegroundColor Green
        Write-Host ''

    - name: 4. Keep Alive (6 Hours)
      run: |
        $duration = 21600
        $interval = 60
        $endTime = (Get-Date).AddSeconds($duration)
        while ((Get-Date) -lt $endTime) {
          $ngrokProcess = Get-Process -Name 'ngrok' -ErrorAction SilentlyContinue
          if (-not $ngrokProcess) {
            Write-Host 'Ngrok dung! Thoat.'
            exit 1
          }
          Start-Sleep -Seconds $interval
        }
