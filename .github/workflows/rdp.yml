name: Windows RDP Free

on:
  workflow_dispatch:

env:
  RDP_USER: khangmc
  RDP_PASS: ${{ secrets.RDP_PASS }}

jobs:
  windows-rdp:
    name: Khoi Dong Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Chay Windows RDP va Tunnel
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAILSCALE_KEY: ${{ secrets.TAILSCALE_KEY }}
        REPO_NAME: ${{ github.repository }}
      run: pwsh -ExecutionPolicy Bypass -File .\start.ps1
